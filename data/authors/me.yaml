bio: |
  Liliana Acosta Puentes es comunicadora social y abogada. Trabaja en la
  Universidad del Tolima, donde dirige la Extensión y Proyección Social y
  enseña en pregrado y posgrado. Su trabajo une la comunicación comunitaria,
  la participación ciudadana y los derechos humanos, de la mano de las
  comunidades rurales del Tolima.

